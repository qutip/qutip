name: Multiprocessing notebook compatibility

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'notebooks/multiprocessing_compatibility.ipynb'
      - 'tools/run-multiprocessing-notebook.py'
      - 'qutip/settings.py'
      - 'qutip/solver/**'
      - '.github/workflows/multiprocessing-notebooks.yml'

defaults:
  run:
    shell: bash -l -e {0}

jobs:
  notebook:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.context }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
        context: [default, spawn, forkserver, fork]
        exclude:
          - os: windows-latest
            context: fork
          - os: windows-latest
            context: forkserver
    env:
      QUTIP_NOTEBOOK_CONTEXT: ${{ matrix.context }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: notebook-compatibility
          python-version: ${{ matrix.python }}
          channels: conda-forge
          conda-remove-defaults: 'true'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Remove GNU linker that shadows MSVC under bash
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe /usr/bin/link
      - name: Install QuTiP and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[runtime_compilation,extras]" ipykernel nbclient nbformat
          python -m ipykernel install --sys-prefix --name python3
      - name: Execute in a fresh kernel
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/tools/run-multiprocessing-notebook.py" \
            "$GITHUB_WORKSPACE/notebooks/multiprocessing_compatibility.ipynb" \
            "$RUNNER_TEMP/multiprocessing-results/executed.ipynb"
      - name: Upload results, including partial output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: multiprocessing-notebook-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.context }}
          path: ${{ runner.temp }}/multiprocessing-results/
          if-no-files-found: warn
