# The name is short because we mostly care how it appears in the pull request
# "checks" dialogue box - it looks like
#     Tests / ubuntu-latest, python-3.9, defaults
# or similar.
name: Tests

on:
    [push, pull_request]
concurrency:
    group: test_${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    # The slightly odd shell call is to force bash to read .bashrc, which is
    # necessary for having conda behave sensibly.  We use bash as the shell even
    # on Windows, since we don't run anything much complicated, and it makes
    # things much simpler.
    shell: bash -l -e {0}

jobs:
  cases:
    name: ${{ matrix.os }}, python${{ matrix.python-version }}, ${{ matrix.case-name }}
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg  # Explicitly define matplotlib backend for Windows tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Test other versions of Python in special cases to avoid exploding the
        # matrix size; make sure to test all supported versions in some form.
        python-version: ["3.14"]
        case-name: ["Latest"]
        numpy-build: [""]
        scipy-build: [""]
        cython-build: [""]
        numpy-run: [""]
        scipy-run: [""]
        # Skip semidefinite: CVXOPT fail to converge, reason unknown...
        qutip-optional: ["[graphics,runtime_compilation,ipython,extras]"]
        pytest-extra-options: ["-W ignore:Matrix:scipy.linalg._misc.LinAlgWarning"]
        # coveralls: [1]  # Why didn't we try to upload them all?

        # Extra special cases.  In these, the new variable defined should always
        # be a truth-y value (hence 'nomkl: 1' rather than 'mkl: 0'), because
        # the lack of a variable is _always_ false-y, and the defaults lack all
        # the special cases.
        include:
          - case-name: MPI, version-1
            os: ubuntu-latest
            python-version: "3.13"
            numpy-run: "==2.4.*"
            scipy-run: "==1.17.*"
            pypi: 1

            qutip-optional: "[full]"
            # Install mpi4py to test mpi_pmap
            # Should be enough to include this in one of the runs
            # Both mpich and openmpi version 4 have caused problems in the past
            # so we use openmpi version 5. Openmpi 5 and python 3.13-compatible
            # version of mpi4py are currently only available on conda-forge:
            conda-extra-pkgs: '"openmpi>=5.0" mpi4py'

          - case-name: no conda, version-2
            os: ubuntu-latest
            python-version: "3.14"
            numpy-run: "==2.3.*"
            scipy-run: "==1.16.*"
            qutip-optional: "[full]"
            pypi: 1

          - case-name: version-3
            os: ubuntu-24.04-arm
            python-version: "3.13"
            numpy-run: "==2.2.*"
            scipy-run: "==1.15.*"
            qutip-optional: "[graphics]"
            pypi: 1

          - case-name: mkl, version-4
            os: ubuntu-latest
            python-version: "3.12"
            numpy-run: "==2.1.*"
            scipy-run: "==1.14.*"
            qutip-optional: "[graphics]"

          - case-name: version-5
            os: ubuntu-latest
            python-version: "3.11"
            numpy-run: "==2.0.*"
            scipy-run: "==1.13.*"
            nomkl: 1
            qutip-optional: "[semidefinite]"
            # Installing matplotlib 3.8 with it's latest dependencies raise this warnings
            pytest-extra-options: "-W ignore::pyparsing.warnings.PyparsingDeprecationWarning"
            pypi-extra-pkgs: "matplotlib==3.8.*"

          - case-name: numpy fallback, nomkl
            os: ubuntu-latest
            python-version: "3.12"
            numpy-run: "==1.26.*"
            scipy-run: "==1.13.*"
            nomkl: 1
            qutip-optional: "[runtime_compilation,ipython,extras]"
            # Installing matplotlib 3.9 with it's latest dependencies also raise this warnings
            pytest-extra-options: "-W ignore::pyparsing.warnings.PyparsingDeprecationWarning"
            pypi-extra-pkgs: "matplotlib==3.9.*"

          - case-name: Oldest officially supported
            os: ubuntu-latest
            python-version: "3.11"
            numpy-build: "==2.0.*"
            scipy-build: "==1.13.*"
            cython-build: "==3.0.*"
            numpy-run: "==1.23.*"
            scipy-run: "==1.13.*"
            qutip-optional: ""
            pypi-extra-pkgs: "cython==0.29.34 setuptools filelock"
            pypi: 1
            pytest-extra-options: "-W ignore:dep_util:DeprecationWarning -W ignore:matplotlib:UserWarning -W ignore::DeprecationWarning:Cython.Tempita"

          # Mac
          # Mac has issues with MKL since september 2022.
          - case-name: macos - latest
            os: macos-latest
            python-version: "3.14"
            nomkl: 1
            qutip-optional: "[graphics,runtime_compilation,ipython,extras]"
            pytest-extra-options: "-W ignore:Matrix:scipy.linalg._misc.LinAlgWarning"

          - case-name: macos - old setup
            os: macos-15-intel  # Test on intel cpus
            python-version: "3.11"
            numpy-build: "==2.0.*"
            numpy-run: "==1.25.*"
            scipy-run: "==1.16.*"
            nomkl: 1
            qutip-optional: "[ipython,extras]"
            pytest-extra-options: "-W ignore:Matrix:scipy.linalg._misc.LinAlgWarning -W ignore::pyparsing.warnings.PyparsingDeprecationWarning"
            pypi-extra-pkgs: "matplotlib==3.8.*"

          # Windows
          # Test 1 recent and one old
          - case-name: Windows - latest - minimal install
            os: windows-11-arm
            python-version: "3.14"
            pypi: 1
            qutip-optional: ""
            # matplotlib not installed
            pytest-extra-options: "-W ignore:Matrix:scipy.linalg._misc.LinAlgWarning -W ignore:matplotlib:UserWarning"

          - case-name: Windows - numpy fallback
            os: windows-latest
            python-version: "3.11"
            numpy-build: "==2.0.*"
            numpy-run: "==1.26.*"
            scipy-run: "==1.17.*"
            qutip-optional: "[ipython,extras]"
            pypi-extra-pkgs: "matplotlib==3.7.*"
            pytest-extra-options: "-W ignore:dep_util:DeprecationWarning -W ignore::pyparsing.warnings.PyparsingDeprecationWarning -W \"ignore:The 'renderer' parameter of do_3d_projection\""

    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        if: matrix.os != 'windows-11-arm'
        # Currently miniconda doesn't support window-11 arms
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge

      - name: Install pip
        if: matrix.os != 'windows-11-arm'
        shell: bash -l {0}
        run: conda install pip -y -n test

      # TODO remove this once conda supports windows arm
      - uses: actions/setup-python@v7
        if: matrix.os == 'windows-11-arm'
        with:
          python-version: ${{ matrix.python-version }}

      # Meson, unlike setuptools/distutils, does not locate and activate the
      # MSVC toolchain itself: it simply looks for cl.exe and link.exe in PATH.
      # This writes the result to GITHUB_ENV, so every later step inherits it.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}

      # Git for Windows ships a coreutils /usr/bin/link.exe,
      # and bash puts that directory ahead of the MSVC toolchain in PATH.
      # Deleting it same as what numpy, scipy do.
      - name: Remove GNU link.exe (shadows MSVC link.exe under bash)
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe /usr/bin/link

      - name: Environment information
        run: |
          uname -a
          if [[ "ubuntu-latest" == "${{ matrix.os }}" ]]; then
              hostnamectl
              lscpu
              free -h
          fi

      - name: Build QuTiP wheel
        run: |
          cd ..  # Meson complain when the venv is in QuTiP's directory
          python -m venv build_env
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ./build_env/Scripts/activate
          else
            source ./build_env/bin/activate
          fi
          cd qutip
          python -m pip install meson-python meson ninja # build
          python -m pip install "cython${{ matrix.cython-build }}"
          python -m pip install "numpy${{ matrix.numpy-build }}"
          python -m pip install "scipy${{ matrix.scipy-build }}"
          python -m pip wheel . --no-build-isolation --no-deps
          echo "Build environment:"
          pip list

      - name: Install QuTiP and dependencies
        working-directory: ${{ runner.temp }}
        run: |
          # Install the extra requirement
          python -m pip install pytest pytest-rerunfailures
          python -m pip install pytest-cov coveralls pytest-fail-slow
          python -m pip install coverage[toml] chardet

          CORE_DEP="numpy${{ matrix.numpy-run }} scipy${{ matrix.scipy-run }}"
          if [[ "${{ matrix.pypi }}" ]]; then
            pip install $CORE_DEP
          elif [[ -z "${{ matrix.nomkl }}" ]]; then
            conda install --channel conda-forge \
              "blas=*=mkl" \
              mkl-devel \
              pkg-config \
              "numpy${{ matrix.numpy-build }}" \
              "scipy${{ matrix.scipy-requirement }}"
            # conda-forge's mkl-devel does not include Intel's pkg-config
            # metadata. Install only that metadata from Intel's wheel while
            # retaining conda's MKL libraries and headers.
            python -m pip install --ignore-installed --no-deps mkl-devel
            export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            mkl_pc="$CONDA_PREFIX/lib/pkgconfig/mkl-sdl.pc"
            sed -i 's|${libdir}/libmkl_rt.so.[0-9][0-9]*|-lmkl_rt|' "$mkl_pc"
            test -e "$CONDA_PREFIX/lib/libmkl_rt.so"
            pkg-config --modversion mkl-sdl
            pkg-config --libs mkl-sdl
          else
            conda install nomkl $CORE_DEP
          fi

          cp "${{ github.workspace }}"/qutip*.whl .
          WHEEL=$( echo qutip*.whl )
          echo $WHEEL
          python -m pip install "$WHEEL${{ matrix.qutip-optional }}" -v
          if [[ -n "${{ matrix.pypi-extra-pkgs }}" ]]; then
            python -m pip install ${{ matrix.pypi-extra-pkgs }}
          fi

          if [[ "${{ matrix.conda-extra-pkgs }}" ]]; then
            conda install ${{ matrix.conda-extra-pkgs }}
          fi

      - name: Package information
        working-directory: ${{ runner.temp }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-11-arm" ]]; then
            pip list
          else
            conda list
          fi
          python -c "import qutip; qutip.about()"
          python -c "import qutip; print(qutip.settings)"

      - name: Run tests
        working-directory: ${{ runner.temp }}
        # If our tests are running for longer than an hour, _something_ is wrong
        # somewhere.  The GitHub default is 6 hours, which is a bit long to wait
        # to see if something hung.
        timeout-minutes: 60
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
        run: |
          if [[ -n "${{ matrix.openmp }}" ]]; then
            # Force OpenMP runs to use more threads, even if there aren't
            # actually that many CPUs.  We have to check any dispatch code is
            # truly being executed.
            export QUTIP_NUM_PROCESSES=2
          fi

          # By default, the max. number of allowed worker processes in openmpi is
          # (number of physical cpu cores) - 1.
          # We only have 2 physical cores, but we want to test mpi_pmap with 2 workers.
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe

          QUTIP_TESTS=$(python -c "import pathlib, qutip; print(pathlib.Path(qutip.__file__).parent / 'tests')")
          pytest -Werror --strict-config --strict-markers --fail-slow=300 --durations=0 --durations-min=1.0 --verbosity=1 --cov=qutip --cov-report= --color=yes ${{ matrix.pytest-extra-options }} "$QUTIP_TESTS"
          # Above flags are:
          #  -Werror
          #     treat warnings as errors
          #  --strict-config
          #     error out if the configuration file is not parseable
          #  --strict-markers
          #     error out if a marker is used but not defined in the
          #     configuration file
          #  --timeout=300
          #     error any individual test that goes longer than the given time
          #  --durations=0 --durations-min=1.0
          #     at the end, show a list of all the tests that took longer than a
          #     second to run
          #  --verbosity=1
          #     turn the verbosity up so pytest prints the names of the tests
          #     it's currently working on
          #  --cov=qutip
          #     limit coverage reporting to code that's within the qutip package
          #  --cov-report=
          #     don't print the coverage report to the terminal---it just adds
          #     cruft, and we're going to upload the .coverage file to Coveralls
          #  --color=yes
          #     force coloured output in the terminal

      - name: Upload to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
          COVERALLS_FLAG_NAME: ${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.case-name }}
          COVERALLS_PARALLEL: true
        run: coveralls --service=github

  towncrier-check:
    name: Verify Towncrier entry added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Towncrier
        run: |
          python -m venv towncrier_check
          source towncrier_check/bin/activate
          python -m pip install towncrier

      - name: Verify Towncrier entry added
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          # Fetch the pull request' base branch so towncrier will be able to
          # compare the current branch with the base branch.
          # Source: https://github.com/actions/checkout/#fetch-all-branches.
          git fetch --no-tags origin +refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}
          source towncrier_check/bin/activate
          towncrier check --compare-with origin/${BASE_BRANCH}
          towncrier build --version "$(cat VERSION)" --draft

  finalise:
    name: Finalise coverage reporting
    needs: cases
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Finalise coverage reporting
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: |
          python -m pip install coveralls
          coveralls --service=github --finish
