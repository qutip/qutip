name: Test family projects
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Which version, empty for development, `release` for latest released version'
        default: ""

  pull_request:

defaults:
  run:
    # The slightly odd shell call is to force bash to read .bashrc, which is
    # necessary for having conda behave sensibly.
    shell: bash -l -e {0}

jobs:
  tests:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [qutip-qip, qutip-jax, qutip-qoc, qutip-qtrl]

    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: 3.11

      - name: Install QuTiP and dependencies
        run: |
          python -m pip install .[runtime_compilation] --group tests -v

      - name: Pre-install development dependencies
        if: ${{ matrix.repo == 'qutip-qoc' }}
        run: |
          cd ..
          git clone https://github.com/qutip/qutip-jax.git
          cd qutip-jax
          if [[ "${{ inputs.version }}" == "release" ]]; then
            # Checkout the latest tag as the latest release
            git fetch --tags
            git checkout $(git describe --tags "$(git rev-list --tags --max-count=1)")
          fi
          python -m pip install . --no-build-isolation

      - name: Install QuTiP family package
        run: |
          cd ..
          git clone https://github.com/qutip/${{ matrix.repo }}.git
          cd ${{ matrix.repo }}
          if [[ "${{ inputs.version }}" == "release" ]]; then
            # Checkout the latest tag as the latest release
            git fetch --tags
            git checkout $(git describe --tags "$(git rev-list --tags --max-count=1)")
          elif [[ "${{ inputs.version }}" ]]; then
            git checkout ${{ inputs.version }}
          fi
          python -m pip install .[full] --no-build-isolation --upgrade-strategy only-if-needed

      - name: Print python environment
        run: |
          pip list

      - name: Run test
        run: |
          cd ../${{ matrix.repo }}
          pytest tests -vv -W "ignore::DeprecationWarning"

  tutorials:
    name: qutip-tutorials, python${{ matrix.python-version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - python-version: "3.15"
            no-conda: false

    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        if: ${{ !matrix.no-conda }}
        with:
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"

      - uses: actions/setup-python@v7
        if: ${{ matrix.no-conda }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout qutip-tutorials
        run: |
          cd ..
          git clone https://github.com/qutip/qutip-tutorials.git

      - name: Install tutorial environment with Conda
        if: ${{ !matrix.no-conda }}
        run: |
          conda install -y \
            "pip>=22.1.2" \
            "setuptools" \
            "numpy>=2.0.0" \
            "scipy>=1.9" \
            "matplotlib>=3.9" \
            "imagemagick>=7.1.0_36" \
            "mpmath>=1.2.1" \
            "pytest>=7.1.2" \
            "nbclient>=0.10.1" \
            "jupytext>=1.13.8" \
            "jupyter>=1.0.0" \
            "ipykernel>=6.17.1" \
            "cython>=0.29.20"

      - name: Install tutorial environment with pip
        if: ${{ matrix.no-conda }}
        run: |
          python -m pip install --upgrade \
            "pip>=22.1.2" \
            "setuptools" \
            "numpy>=2.0.0" \
            "scipy>=1.9" \
            "matplotlib>=3.9" \
            "mpmath>=1.2.1" \
            "pytest>=7.1.2" \
            "nbclient>=0.10.1" \
            "jupytext>=1.13.8" \
            "jupyter>=1.0.0" \
            "ipykernel>=6.17.1" \
            "cython>=0.29.20"

      - name: Install notebook test plugin from PyPI
        # Conda's nbmake 1.5.5 requires nbclient<0.7; PyPI permits modern nbclient.
        run: |
          python -m pip install "nbmake>=1.5.5" "nbclient>=0.10.1"

      - name: Install QuTiP from this checkout
        run: |
          python -m pip install '.[runtime_compilation]'

      - name: Install JAX dependencies
        run: |
          python -m pip install "jax[cpu]>=0.7.1" equinox diffrax

      - name: Install tutorial family packages
        run: |
          python -m pip install qutip-qip
          python -m pip install --no-deps git+https://github.com/qutip/qutip-jax
          python -m pip install --no-deps git+https://github.com/qutip/qutip-qtrl
          python -m pip install --no-deps git+https://github.com/qutip/qutip-qoc

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick texlive-latex-extra

      - name: Convert v5 parallelisation tutorials to notebooks
        run: |
          notebooks=()
          while IFS= read -r notebook; do
            # Git may check out the list with CRLF line endings on Windows.
            notebooks+=("${notebook%$'\r'}")
          done < tools/parallel-tutorials.txt
          cd ../qutip-tutorials
          mkdir notebooks
          cp -r tutorials-v5/* notebooks
          cd notebooks
          for notebook in "${notebooks[@]}"; do
            jupytext --to notebook "${notebook%.ipynb}.md"
          done

      - name: Run parallelisation tutorial notebooks
        run: |
          # Shared with the local runner; include parallel_map and parallel solver options.
          notebooks=()
          while IFS= read -r notebook; do
            # Git may check out the list with CRLF line endings on Windows.
            notebooks+=("${notebook%$'\r'}")
          done < tools/parallel-tutorials.txt
          cd ../qutip-tutorials/notebooks
          pytest --nbmake --nbmake-timeout=900 "${notebooks[@]}"
